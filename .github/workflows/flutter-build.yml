name: Build Centeks Destek (Windows x64)

on:
  workflow_dispatch:
    inputs:
      upload-artifact:
        type: boolean
        description: "Upload artifacts"
        default: true
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: "nightly"
      publish-update-metadata:
        type: boolean
        default: false
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CenteksDeskUI/**"

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VERSION: "1.5.3"

jobs:
  generate-bridge:
    name: Generate Flutter Rust Bridge
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Install Flutter (for bridge codegen)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Run Flutter Rust Bridge Codegen
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Upload Bridge Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart

  build-windows:
    name: Centeks Destek Windows (x86_64)
    needs: [generate-bridge]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with RustDesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $flutterPath = "${{ steps.flutter.outputs['CACHE-PATH'] }}"
          Copy-Item -Path "windows-x64-release\*" -Destination "$flutterPath\bin\cache\artifacts\engine\windows-x64-release\" -Recurse -Force

      - name: Patch flutter dropdown menu
        shell: bash
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_DIR"
          cd "$FLUTTER_DIR"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build WindowInjection (RustDeskTempTopMostWindow)
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          pushd RustDeskTempTopMostWindow
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          popd

      - name: Build RustDesk Client
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Copy WindowInjection.dll into ./rustdesk
          Copy-Item -Path "RustDeskTempTopMostWindow\WindowInjection\x64\Release\WindowInjection.dll" -Destination "./rustdesk\" -Force

          # Download virtual display driver (usbmmidd_v2)
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -Force
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat" -Force
          Copy-Item -Path ".\usbmmidd_v2\*" -Destination "./rustdesk/usbmmidd_v2" -Recurse -Force

          # Download printer driver
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
            New-Item -ItemType Directory -Force -Path ./rustdesk/drivers | Out-Null
            Copy-Item -Path ".\rustdesk_printer_driver_v4-1.4\*" -Destination "./rustdesk/drivers/RustDeskPrinterDriver" -Recurse -Force
            Expand-Archive printer_driver_adapter.zip -DestinationPath .
            Copy-Item -Path ".\printer_driver_adapter.dll" -Destination "./rustdesk\" -Force
          } catch {
            Write-Host "Skipping printer driver due to non-critical warning."
          }

      - name: Build Self-Extracting Standalone Portable EXE
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          runner_res=$(find . -name "Runner.res" | head -n 1)
          if [ -n "$runner_res" ]; then
            cp "$runner_res" ./libs/portable/Runner.res
          fi
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./dist
          cp ./target/release/rustdesk-portable-packer.exe ./dist/CenteksDestek-x86_64.exe
          cp ./target/release/rustdesk-portable-packer.exe "./dist/CenteksDestek-host=destek.centeks.com,key=MGQRTw1Xi9Z7mpyzIYtiqPyYETYHjq9lydT5vHUS02.exe"

      - name: Code sign Windows executable (Safe By-Pass)
        continue-on-error: true
        shell: powershell
        env:
          CERT_BASE64: ${{ secrets.CERT_BASE64 }}
          CERTIFICATE_PFX: ${{ secrets.CERTIFICATE_PFX }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          $certData = if (![string]::IsNullOrWhiteSpace($env:CERTIFICATE_PFX)) { $env:CERTIFICATE_PFX } else { $env:CERT_BASE64 }
          if ([string]::IsNullOrWhiteSpace($certData)) {
            Write-Host "CERTIFICATE_PFX / CERT_BASE64 secret is not configured; skipping code signing without error."
          } else {
            Write-Host "Certificate secret detected, attempting digital signature..."
            try {
              $certBytes = [System.Convert]::FromBase64String($certData)
              $certPath = "$pwd\cert.pfx"
              [System.IO.File]::WriteAllBytes($certPath, $certBytes)

              $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
              if (-not $signtool) { $signtool = "signtool.exe" }

              Get-ChildItem -Path "./dist" -Filter "*.exe" | ForEach-Object {
                Write-Host "Signing $($_.FullName)..."
                $signArgs = @("sign", "/f", $certPath, "/fd", "SHA256", "/tr", "http://timestamp.digicert.com", "/td", "SHA256")
                if (![string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
                  $signArgs += @("/p", $env:CERT_PASSWORD)
                }
                $signArgs += $_.FullName
                & $signtool $signArgs
              }
              if (Test-Path $certPath) { Remove-Item -Force $certPath }
              Write-Host "Code signing completed successfully."
            } catch {
              Write-Warning "Code signing encountered an error, continuing build: $_"
            }
          }

      - name: Upload CenteksDestek Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: CenteksDestek-x86_64
          path: |
            ./dist/CenteksDestek-x86_64.exe
            ./dist/CenteksDestek-*.exe
          if-no-files-found: error
