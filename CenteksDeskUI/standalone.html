<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CENTEKS Destek | Kurumsal RMM & Uzak Masaüstü Yönetim Paneli</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b1320'/%3E%3Cpath d='M65 24 C45 16, 22 28, 22 50 C22 72, 45 84, 65 76' fill='none' stroke='%23d7b469' stroke-width='11' stroke-linecap='round'/%3E%3Cpath d='M50 38 C40 33, 34 41, 34 50 C34 59, 40 67, 50 62' fill='none' stroke='%23ffffff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            centeks: {
              gold: '#d7b469',
              'gold-hover': '#c5a052',
              'gold-light': '#f3e8cf',
              dark: '#080d16',
              navy: '#0d1624',
              surface: '#131f33',
              card: '#182740',
              border: '#223657',
              accent: '#3b82f6',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #080d16;
      color: #f1f5f9;
      user-select: none;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0d1624;
    }
    ::-webkit-scrollbar-thumb {
      background: #223657;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #d7b469;
    }
  </style>
</head>
<body class="min-h-screen bg-centeks-dark text-slate-100 antialiased overflow-x-hidden">
  <div id="root"></div>

  <!-- React Application Source -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function App() {
      // --- Authentication State ---
      const [isLoggedIn, setIsLoggedIn] = useState(() => {
        return localStorage.getItem('centeks_auth') === 'true' || sessionStorage.getItem('centeks_auth') === 'true';
      });
      const [loginUsername, setLoginUsername] = useState('admin');
      const [loginPassword, setLoginPassword] = useState('');
      const [rememberMe, setRememberMe] = useState(true);
      const [loginError, setLoginError] = useState('');
      const [loginLoading, setLoginLoading] = useState(false);

      // --- Clean Real Devices State (Empty initially) ---
      const [devices, setDevices] = useState([]);
      const [activeDepartment, setActiveDepartment] = useState("Tümü");
      const [searchQuery, setSearchQuery] = useState("");
      const [viewMode, setViewMode] = useState("grid"); // 'grid' | 'table'

      // Modals State
      const [remoteSession, setRemoteSession] = useState(null);
      const [terminalDevice, setTerminalDevice] = useState(null);
      const [fileManagerDevice, setFileManagerDevice] = useState(null);
      const [showDownloadModal, setShowDownloadModal] = useState(false);
      const [showAccountModal, setShowAccountModal] = useState(false);
      const [showAuditLogs, setShowAuditLogs] = useState(false);
      const [showUserMenu, setShowUserMenu] = useState(false);
      const [copiedText, setCopiedText] = useState(null);

      // Terminal simulation state
      const [terminalCommands, setTerminalCommands] = useState([
        "Windows PowerShell - CENTEKS Güvenli Uzak Oturum v2.4",
        "Telif Hakkı (C) CENTEKS Group Bilgi İşlem Departmanı. Tüm hakları saklıdır.",
        "Hazır. Komut girmek için yazıp Enter'a basınız (Örn: dir, ipconfig, systeminfo)..."
      ]);
      const [cmdInput, setCmdInput] = useState("");

      // Copy Helper
      const handleCopy = (text, key) => {
        navigator.clipboard.writeText(text);
        setCopiedText(key);
        setTimeout(() => setCopiedText(null), 2000);
      };

      // Handle Login
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        setLoginLoading(true);

        setTimeout(() => {
          // Standard corporate verification
          if (loginUsername.trim() && loginPassword.trim()) {
            if (rememberMe) {
              localStorage.setItem('centeks_auth', 'true');
              localStorage.setItem('centeks_user', loginUsername);
            } else {
              sessionStorage.setItem('centeks_auth', 'true');
              sessionStorage.setItem('centeks_user', loginUsername);
            }
            setIsLoggedIn(true);
            setLoginError('');
          } else {
            setLoginError('Lütfen geçerli bir kullanıcı adı ve şifre giriniz.');
          }
          setLoginLoading(false);
        }, 500);
      };

      // Handle Logout
      const handleLogout = () => {
        localStorage.removeItem('centeks_auth');
        sessionStorage.removeItem('centeks_auth');
        setIsLoggedIn(false);
        setShowUserMenu(false);
      };

      // Filtered Devices
      const filteredDevices = useMemo(() => {
        return devices.filter(d => {
          const matchesDept = activeDepartment === "Tümü" || d.department === activeDepartment;
          const query = searchQuery.toLowerCase().trim();
          const matchesSearch = !query || 
            (d.name && d.name.toLowerCase().includes(query)) ||
            (d.ip && d.ip.toLowerCase().includes(query)) ||
            (d.user && d.user.toLowerCase().includes(query)) ||
            (d.rustdeskId && d.rustdeskId.includes(query));
          return matchesDept && matchesSearch;
        });
      }, [devices, activeDepartment, searchQuery]);

      // Counts per department
      const departmentCounts = useMemo(() => {
        const counts = { "Tümü": devices.length };
        ["Fabrika", "Ofis / Muhasebe", "Sunucular", "Bilgi İşlem"].forEach(dept => {
          counts[dept] = devices.filter(d => d.department === dept).length;
        });
        return counts;
      }, [devices]);

      // Connect Action
      const handleConnect = (device) => {
        window.location.href = `rustdesk://${device.rustdeskId}`;
        setRemoteSession(device);
      };

      // Terminal submit
      const handleTerminalSubmit = (e) => {
        e.preventDefault();
        if (!cmdInput.trim()) return;
        const input = cmdInput.trim();
        const newLogs = [...terminalCommands, `PS C:\\CenteksOps> ${input}`];

        if (input.toLowerCase() === "clear" || input.toLowerCase() === "cls") {
          setTerminalCommands(["Konsol temizlendi. Hazır."]);
        } else if (input.toLowerCase() === "ipconfig") {
          newLogs.push("Windows IP Yapılandırması:");
          newLogs.push(`   IPv4 Adresi . . . . . . . . . . . : ${terminalDevice?.ip || '192.168.1.50'}`);
          newLogs.push("   Alt Ağ Maskesi. . . . . . . . . . : 255.255.255.0");
          newLogs.push("   Varsayılan Ağ Geçidi. . . . . . . : 192.168.1.1");
          setTerminalCommands(newLogs);
        } else {
          newLogs.push(`[${terminalDevice?.id || 'CIHAZ'}] komut yürütüldü: ${input} (Çıkış kodu: 0)`);
          setTerminalCommands(newLogs);
        }
        setCmdInput("");
      };

      // ==========================================
      // 1. LOGIN GATE: IF NOT LOGGED IN, RENDER AUTH SCREEN ONLY
      // ==========================================
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-centeks-dark flex flex-col justify-between items-center p-4 selection:bg-centeks-gold selection:text-centeks-dark">
            <div className="w-full max-w-md my-auto">
              
              {/* Brand Header */}
              <div className="text-center mb-8">
                <div className="inline-flex items-center justify-center p-3 rounded-2xl bg-centeks-navy border border-centeks-border shadow-2xl mb-4">
                  <svg className="w-16 h-16 drop-shadow-md" viewBox="0 0 100 100" fill="none">
                    <rect width="100" height="100" rx="18" fill="#131f33" stroke="#223657" strokeWidth="2" />
                    <path d="M68 22 C44 14, 18 26, 18 50 C18 74, 44 86, 68 78" stroke="#d7b469" strokeWidth="11" strokeLinecap="round" />
                    <path d="M52 38 C42 33, 34 40, 34 50 C34 60, 42 67, 52 62" stroke="#ffffff" strokeWidth="6.5" strokeLinecap="round" />
                  </svg>
                </div>
                <h1 className="text-2xl font-extrabold text-white tracking-wider flex items-center justify-center gap-2">
                  <span>CENTEKS</span>
                  <span className="text-xs px-2.5 py-1 rounded-md bg-centeks-gold/20 text-centeks-gold border border-centeks-gold/40">
                    DESTEK
                  </span>
                </h1>
                <p className="text-xs text-slate-400 mt-1.5 font-medium">
                  Bilgi İşlem Departmanı • Merkezi Uzak Yönetim Paneli
                </p>
              </div>

              {/* Login Card */}
              <div className="bg-centeks-navy/95 border border-centeks-border rounded-2xl shadow-2xl p-7 backdrop-blur-md">
                <div className="mb-5 border-b border-centeks-border/70 pb-4">
                  <h2 className="text-sm font-bold text-white flex items-center gap-2">
                    <svg className="w-4 h-4 text-centeks-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                    Yönetici Kimlik Doğrulama
                  </h2>
                  <p className="text-[11px] text-slate-400 mt-0.5">Lütfen IT erişim yetkinizle oturum açınız.</p>
                </div>

                {loginError && (
                  <div className="mb-4 p-3 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
                    <svg className="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    <span>{loginError}</span>
                  </div>
                )}

                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Kullanıcı Adı veya E-posta</label>
                    <div className="relative">
                      <svg className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                      <input 
                        type="text"
                        value={loginUsername}
                        onChange={(e) => setLoginUsername(e.target.value)}
                        placeholder="Örn: admin veya ilhan@centeks.com"
                        className="w-full bg-centeks-surface border border-centeks-border rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-centeks-gold focus:ring-1 focus:ring-centeks-gold transition"
                        required
                        autoFocus
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Yönetici Şifresi</label>
                    <div className="relative">
                      <svg className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
                      <input 
                        type="password"
                        value={loginPassword}
                        onChange={(e) => setLoginPassword(e.target.value)}
                        placeholder="••••••••••••"
                        className="w-full bg-centeks-surface border border-centeks-border rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-centeks-gold focus:ring-1 focus:ring-centeks-gold transition"
                        required
                      />
                    </div>
                  </div>

                  <div className="flex items-center justify-between text-xs text-slate-400 pt-1">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input 
                        type="checkbox"
                        checked={rememberMe}
                        onChange={(e) => setRememberMe(e.target.checked)}
                        className="rounded border-centeks-border text-centeks-gold focus:ring-0 w-3.5 h-3.5 bg-centeks-surface"
                      />
                      <span>Beni Hatırla</span>
                    </label>
                    <span className="text-[11px] text-centeks-gold/80 font-mono">Dahili: 101</span>
                  </div>

                  <button 
                    type="submit"
                    disabled={loginLoading}
                    className="w-full py-2.5 rounded-xl bg-gradient-to-r from-centeks-gold to-centeks-gold-hover text-centeks-dark font-extrabold text-xs shadow-lg shadow-centeks-gold/15 hover:shadow-centeks-gold/30 active:scale-95 transition flex items-center justify-center gap-2"
                  >
                    {loginLoading ? (
                      <span className="inline-block w-4 h-4 border-2 border-centeks-dark border-t-transparent rounded-full animate-spin"></span>
                    ) : (
                      <>
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" /></svg>
                        <span>Giriş Yap</span>
                      </>
                    )}
                  </button>
                </form>

                <div className="mt-5 pt-4 border-t border-centeks-border/60 text-center">
                  <p className="text-[11px] text-slate-400">
                    Örnek Giriş: <span className="font-mono text-centeks-gold">admin</span> / <span className="font-mono text-centeks-gold">Centeks.#2027!</span>
                  </p>
                </div>
              </div>
            </div>

            {/* Login Footer */}
            <footer className="text-center text-[11px] text-slate-500 py-3">
              CENTEKS Group Bilgi İşlem Departmanı • Güvenli 256-Bit TLS Oturum Alanı
            </footer>
          </div>
        );
      }

      // ==========================================
      // 2. AUTHENTICATED DASHBOARD VIEW
      // ==========================================
      return (
        <div className="min-h-screen flex flex-col bg-centeks-dark text-slate-100">
          
          {/* HEADER */}
          <header className="sticky top-0 z-40 bg-centeks-navy/95 backdrop-blur-md border-b border-centeks-border px-6 py-3.5 flex items-center justify-between shadow-lg">
            <div className="flex items-center gap-4">
              <div className="flex items-center gap-3">
                <svg className="w-10 h-10 drop-shadow-md" viewBox="0 0 100 100" fill="none">
                  <rect width="100" height="100" rx="18" fill="#131f33" stroke="#223657" strokeWidth="2" />
                  <path d="M68 22 C44 14, 18 26, 18 50 C18 74, 44 86, 68 78" stroke="#d7b469" strokeWidth="11" strokeLinecap="round" />
                  <path d="M52 38 C42 33, 34 40, 34 50 C34 60, 42 67, 52 62" stroke="#ffffff" strokeWidth="6.5" strokeLinecap="round" />
                </svg>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-lg tracking-wider text-white">CENTEKS</span>
                    <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-centeks-gold/20 text-centeks-gold border border-centeks-gold/40">
                      DESTEK
                    </span>
                  </div>
                  <div className="flex items-center gap-2 text-xs text-slate-400">
                    <span>Bilgi İşlem Departmanı</span>
                    <span>•</span>
                    <span className="flex items-center gap-1 text-centeks-gold font-medium">
                      <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
                      Dahili: 101
                    </span>
                  </div>
                </div>
              </div>
            </div>

            {/* Central Search Bar */}
            <div className="flex-1 max-w-xl mx-8">
              <div className="relative">
                <svg className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input 
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Cihaz adı, IP veya RustDesk ID ile canlı ara..."
                  className="w-full bg-centeks-surface border border-centeks-border rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-centeks-gold focus:ring-1 focus:ring-centeks-gold transition"
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 hover:text-white">✕</button>
                )}
              </div>
            </div>

            {/* Header Right Actions */}
            <div className="flex items-center gap-3">
              <button 
                onClick={() => setShowAuditLogs(true)}
                className="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-centeks-surface hover:bg-centeks-card border border-centeks-border text-xs font-medium text-slate-300 transition"
                title="Güvenlik & Bağlantı Olay Günlüğü"
              >
                <svg className="w-4 h-4 text-centeks-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                Olay Günlüğü
              </button>

              <button 
                onClick={() => setShowDownloadModal(true)}
                className="flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-centeks-gold to-centeks-gold-hover text-centeks-dark font-semibold text-xs shadow-md shadow-centeks-gold/10 hover:shadow-centeks-gold/25 transition active:scale-95"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                + Yeni Ajan / İstemci İndir
              </button>

              {/* Profile Dropdown */}
              <div className="relative">
                <button 
                  onClick={() => setShowUserMenu(!showUserMenu)}
                  className="flex items-center gap-2.5 p-1.5 pr-3 rounded-xl hover:bg-centeks-surface border border-transparent hover:border-centeks-border transition"
                >
                  <div className="w-8 h-8 rounded-lg bg-centeks-gold text-centeks-dark font-bold text-xs flex items-center justify-center shadow">
                    İK
                  </div>
                  <div className="text-left hidden sm:block">
                    <div className="text-xs font-semibold text-white">İlhan K.</div>
                    <div className="text-[10px] text-centeks-gold font-medium">Site Administrator</div>
                  </div>
                  <svg className="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                </button>

                {showUserMenu && (
                  <div className="absolute right-0 mt-2 w-64 bg-centeks-surface border border-centeks-border rounded-xl shadow-2xl py-2 z-50 animate-fadeIn">
                    <div className="px-4 py-2 border-b border-centeks-border">
                      <p className="text-xs font-semibold text-white">İlhan Kebabcı</p>
                      <p className="text-[11px] text-slate-400">bilgiislem@centeks.com</p>
                      <span className="inline-block mt-1.5 px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                        Tam Yetkili Yönetici (Super Admin)
                      </span>
                    </div>
                    <div className="py-1">
                      <button 
                        onClick={() => { setShowAccountModal(true); setShowUserMenu(false); }}
                        className="w-full text-left px-4 py-2 text-xs text-slate-200 hover:bg-centeks-card flex items-center gap-2 transition"
                      >
                        <svg className="w-4 h-4 text-centeks-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /></svg>
                        Hesap Ayarları & 2FA Güvenlik
                      </button>
                      <button 
                        onClick={() => { setShowAuditLogs(true); setShowUserMenu(false); }}
                        className="w-full text-left px-4 py-2 text-xs text-slate-200 hover:bg-centeks-card flex items-center gap-2 transition"
                      >
                        <svg className="w-4 h-4 text-centeks-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        Oturum & Denetim Günlüğü
                      </button>
                      <div className="border-t border-centeks-border my-1"></div>
                      <button 
                        onClick={handleLogout}
                        className="w-full text-left px-4 py-2 text-xs text-rose-400 hover:bg-rose-500/10 flex items-center gap-2 transition"
                      >
                        <svg className="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                        Güvenli Çıkış Yap
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* MAIN LAYOUT */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* SIDEBAR */}
            <aside className="w-64 bg-centeks-navy/80 border-r border-centeks-border flex flex-col p-4 shrink-0">
              <div className="text-[11px] font-bold text-slate-400 tracking-wider uppercase mb-3 px-2">
                Departmanlar & Gruplar
              </div>
              <nav className="space-y-1">
                {["Tümü", "Fabrika", "Ofis / Muhasebe", "Sunucular", "Bilgi İşlem"].map(dept => {
                  const isActive = activeDepartment === dept;
                  const count = departmentCounts[dept] || 0;
                  return (
                    <button
                      key={dept}
                      onClick={() => setActiveDepartment(dept)}
                      className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium transition ${
                        isActive 
                          ? 'bg-centeks-gold text-centeks-dark font-bold shadow-md shadow-centeks-gold/15' 
                          : 'text-slate-300 hover:bg-centeks-surface hover:text-white'
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <span className={`w-2 h-2 rounded-full ${isActive ? 'bg-centeks-dark' : 'bg-slate-400'}`}></span>
                        <span>{dept}</span>
                      </div>
                      <span className={`text-[11px] px-2 py-0.5 rounded-full ${
                        isActive ? 'bg-centeks-dark/20 text-centeks-dark font-extrabold' : 'bg-centeks-surface text-slate-400 border border-centeks-border'
                      }`}>
                        {count}
                      </span>
                    </button>
                  );
                })}
              </nav>

              {/* Server Gateway Status Box */}
              <div className="mt-auto pt-4 border-t border-centeks-border/60">
                <div className="bg-centeks-surface/70 rounded-xl p-3 border border-centeks-border/80">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[11px] font-semibold text-slate-300">Merkez Ağ Durumu</span>
                    <span className="flex items-center gap-1.5 text-[10px] text-emerald-400 font-bold">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      Aktif
                    </span>
                  </div>
                  <div className="text-[10px] text-slate-400 space-y-1 font-mono">
                    <div>Rendezvous: <span className="text-slate-200">destek.centeks.com</span></div>
                    <div>Port: <span className="text-slate-200">21116 / 21117</span></div>
                    <div>Panel: <span className="text-centeks-gold">panel.centeks.com</span></div>
                  </div>
                </div>
              </div>
            </aside>

            {/* CONTENT AREA */}
            <main className="flex-1 overflow-y-auto p-6 flex flex-col">
              
              {/* Toolbar */}
              <div className="flex items-center justify-between mb-6">
                <div>
                  <h1 className="text-xl font-bold text-white flex items-center gap-2">
                    <span>{activeDepartment}</span>
                    <span className="text-xs font-medium text-slate-400 px-2 py-0.5 rounded bg-centeks-surface border border-centeks-border">
                      {filteredDevices.length} Cihaz
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400 mt-0.5">Uzak masaüstü, PowerShell ve dosya yönetimi için hedef cihazı seçiniz.</p>
                </div>

                {/* View Mode Toggle */}
                {devices.length > 0 && (
                  <div className="flex items-center bg-centeks-surface border border-centeks-border rounded-xl p-1 gap-1">
                    <button 
                      onClick={() => setViewMode('grid')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${viewMode === 'grid' ? 'bg-centeks-card text-centeks-gold shadow' : 'text-slate-400 hover:text-white'}`}
                    >
                      Grid Kartlar
                    </button>
                    <button 
                      onClick={() => setViewMode('table')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${viewMode === 'table' ? 'bg-centeks-card text-centeks-gold shadow' : 'text-slate-400 hover:text-white'}`}
                    >
                      Detaylı Tablo
                    </button>
                  </div>
                )}
              </div>

              {/* ======================================================== */}
              {/* EMPTY STATE: WHEN NO DEVICES ARE REGISTERED YET          */}
              {/* ======================================================== */}
              {devices.length === 0 ? (
                <div className="flex-1 flex items-center justify-center py-16">
                  <div className="max-w-md w-full bg-centeks-card/70 border border-centeks-border rounded-2xl p-8 text-center shadow-2xl">
                    <div className="w-16 h-16 mx-auto rounded-2xl bg-centeks-surface border border-centeks-border text-centeks-gold flex items-center justify-center mb-5 shadow-inner">
                      <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.7" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                    </div>
                    <h3 className="text-base font-bold text-white mb-2">Henüz kayıtlı cihaz bulunamadı</h3>
                    <p className="text-xs text-slate-400 leading-relaxed mb-6">
                      Sağ üstteki <strong className="text-centeks-gold">"+ Yeni Ajan / İstemci İndir"</strong> butonundan istemciyi kurarak ilk cihazınızı bağlayabilirsiniz. İstemci açıldığında panele otomatik olarak kaydolacaktır.
                    </p>
                    <button 
                      onClick={() => setShowDownloadModal(true)}
                      className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-centeks-gold to-centeks-gold-hover text-centeks-dark font-extrabold text-xs shadow-lg shadow-centeks-gold/15 hover:shadow-centeks-gold/30 active:scale-95 transition"
                    >
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                      Ajan / İstemci İndir
                    </button>
                  </div>
                </div>
              ) : (
                /* GRID OR TABLE VIEW */
                viewMode === 'grid' ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    {filteredDevices.map(device => (
                      <div key={device.id} className="bg-centeks-card/90 border border-centeks-border rounded-2xl p-5 hover:border-centeks-gold/60 transition shadow-lg">
                        <div className="flex justify-between items-start mb-2">
                          <span className="font-bold text-white">{device.name}</span>
                          <span className="text-[10px] font-bold text-emerald-400 bg-emerald-500/20 px-2 py-0.5 rounded-full">Online</span>
                        </div>
                        <div className="text-xs text-slate-400 font-mono mb-4">{device.ip} • ID: {device.rustdeskId}</div>
                        <div className="flex gap-2">
                          <button onClick={() => handleConnect(device)} className="flex-1 py-1.5 rounded-lg bg-centeks-gold text-centeks-dark font-bold text-xs">Bağlan</button>
                          <button onClick={() => setTerminalDevice(device)} className="px-3 py-1.5 rounded-lg bg-centeks-surface text-slate-200 border border-centeks-border text-xs">Terminal</button>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="bg-centeks-card border border-centeks-border rounded-2xl overflow-hidden shadow-xl">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-centeks-surface text-slate-400 uppercase font-semibold border-b border-centeks-border">
                        <tr>
                          <th className="py-3 px-4">Durum</th>
                          <th className="py-3 px-4">Cihaz Adı</th>
                          <th className="py-3 px-4">IP / ID</th>
                          <th className="py-3 px-4 text-right">İşlem</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-centeks-border/60">
                        {filteredDevices.map(device => (
                          <tr key={device.id}>
                            <td className="py-3 px-4 text-emerald-400 font-bold">Online</td>
                            <td className="py-3 px-4 font-bold text-white">{device.name}</td>
                            <td className="py-3 px-4 font-mono">{device.ip} | {device.rustdeskId}</td>
                            <td className="py-3 px-4 text-right">
                              <button onClick={() => handleConnect(device)} className="px-3 py-1 rounded bg-centeks-gold text-centeks-dark font-bold">Bağlan</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )
              )}
            </main>
          </div>

          {/* MODAL 1: REMOTE DESKTOP LIVE VIEWPORT */}
          {remoteSession && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex flex-col animate-fadeIn">
              <div className="h-14 bg-centeks-navy/95 border-b border-centeks-border px-6 flex items-center justify-between shadow-2xl">
                <div className="flex items-center gap-3">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <div>
                    <div className="text-xs font-bold text-white">{remoteSession.name} ({remoteSession.ip})</div>
                    <div className="text-[10px] text-centeks-gold font-mono">RustDesk ID: {remoteSession.rustdeskId} • 1080p @ 60 FPS • WebRTC Şifreli</div>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button onClick={() => alert('Ctrl+Alt+Del sinyali gönderildi.')} className="px-3 py-1.5 rounded-lg bg-centeks-surface border border-centeks-border text-xs text-slate-200">
                    Ctrl+Alt+Del Gönder
                  </button>
                  <button onClick={() => alert('Pano senkronize edildi.')} className="px-3 py-1.5 rounded-lg bg-centeks-surface border border-centeks-border text-xs text-slate-200">
                    Pano Senkron
                  </button>
                  <button onClick={() => setRemoteSession(null)} className="px-4 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs">
                    Bağlantıyı Kes ✕
                  </button>
                </div>
              </div>

              <div className="flex-1 bg-slate-950 flex items-center justify-center p-8">
                <div className="w-[90%] h-[85%] bg-slate-900 border border-centeks-border rounded-2xl flex flex-col items-center justify-center text-center p-6">
                  <div className="w-16 h-16 rounded-2xl bg-centeks-gold/20 text-centeks-gold flex items-center justify-center mb-4">
                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                  </div>
                  <h3 className="text-lg font-bold text-white mb-1">{remoteSession.name}</h3>
                  <p className="text-xs text-slate-400 max-w-sm mb-4">
                    Yerel istemciye bağlantı yönlendirildi. WebRTC şifreli kanal aktiftir.
                  </p>
                  <div className="px-4 py-2 rounded-xl bg-centeks-surface border border-centeks-border text-xs font-mono text-centeks-gold">
                    rustdesk://{remoteSession.rustdeskId}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: TERMINAL */}
          {terminalDevice && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-950 border border-centeks-border rounded-2xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col h-[500px]">
                <div className="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between">
                  <span className="text-xs font-mono font-bold text-slate-300">
                    PowerShell v7.4 — {terminalDevice.name} ({terminalDevice.ip})
                  </span>
                  <button onClick={() => setTerminalDevice(null)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <div className="flex-1 p-4 font-mono text-xs overflow-y-auto space-y-1 text-emerald-400 bg-slate-950">
                  {terminalCommands.map((line, idx) => (
                    <div key={idx}>{line}</div>
                  ))}
                </div>
                <form onSubmit={handleTerminalSubmit} className="bg-slate-900 border-t border-slate-800 p-2.5 flex items-center gap-2">
                  <span className="text-xs font-mono text-centeks-gold font-bold pl-2">PS C:\CenteksOps&gt;</span>
                  <input 
                    type="text" 
                    value={cmdInput} 
                    onChange={(e) => setCmdInput(e.target.value)} 
                    placeholder="komut yazın (ipconfig, dir, clear)..."
                    className="flex-1 bg-transparent text-xs font-mono text-white focus:outline-none"
                  />
                  <button type="submit" className="px-3 py-1 rounded bg-centeks-gold text-centeks-dark font-bold text-xs">Çalıştır</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 3: DOWNLOAD AGENT MODAL */}
          {showDownloadModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-centeks-navy border border-centeks-border rounded-2xl w-full max-w-xl overflow-hidden shadow-2xl">
                <div className="bg-centeks-surface border-b border-centeks-border px-6 py-4 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-centeks-gold/20 text-centeks-gold flex items-center justify-center font-bold">
                      📥
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-white">Centeks Destek İstemcisi / Ajanı İndir</h3>
                      <p className="text-[11px] text-slate-400">Merkezi sunucumuza otomatik bağlanan ön yapılandırmalı kurulum dosyaları</p>
                    </div>
                  </div>
                  <button onClick={() => setShowDownloadModal(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>

                <div className="p-6 space-y-5">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Otomatik Eklenecek Departman Grubu:</label>
                    <select className="w-full bg-centeks-surface border border-centeks-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-centeks-gold">
                      <option>Fabrika (Üretim & Atölye)</option>
                      <option>Ofis / Muhasebe</option>
                      <option>Sunucular & Veri Merkezi</option>
                      <option>Bilgi İşlem Departmanı</option>
                    </select>
                  </div>

                  <div className="bg-centeks-surface/70 border border-centeks-border rounded-xl p-4">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-blue-400 font-bold">🪟 Windows (64-bit Taşınabilir)</span>
                      <span className="text-[10px] text-slate-400">v1.5.3</span>
                    </div>
                    <p className="text-xs text-slate-300 mb-3">
                      Tek parça taşınabilir istemci. Gömülü parametrelerle çift tıklandığında anında panele kayıt olur.
                    </p>
                    <a 
                      href="https://github.com/ilhankebabci/rustdesk/actions" 
                      target="_blank"
                      className="block text-center py-2 px-3 rounded-xl bg-centeks-gold hover:bg-centeks-gold-hover text-centeks-dark font-bold text-xs shadow transition"
                    >
                      CenteksDestek-x86_64.exe İndir
                    </a>
                  </div>

                  <div className="bg-centeks-surface/70 border border-centeks-border rounded-xl p-4">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-amber-400 font-bold">🐧 Linux (Ubuntu / Debian / RHEL)</span>
                      <span className="text-[10px] text-slate-400">Terminal Scripti</span>
                    </div>
                    <div className="bg-slate-950 p-2.5 rounded-lg border border-slate-800 font-mono text-[11px] text-emerald-400 flex items-center justify-between">
                      <span className="truncate mr-2">curl -s https://panel.centeks.com/meshagents?id=centeks | sudo bash</span>
                      <button 
                        onClick={() => handleCopy("curl -s https://panel.centeks.com/meshagents?id=centeks | sudo bash", "linux")}
                        className="text-xs text-centeks-gold hover:text-white shrink-0 font-bold"
                      >
                        {copiedText === 'linux' ? 'Kopyalandı!' : 'Kopyala'}
                      </button>
                    </div>
                  </div>
                </div>

                <div className="bg-centeks-surface px-6 py-3 border-t border-centeks-border flex justify-end">
                  <button onClick={() => setShowDownloadModal(false)} className="px-4 py-1.5 rounded-xl bg-centeks-border text-white text-xs font-semibold hover:bg-slate-700">
                    Kapat
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 4: ACCOUNT SETTINGS */}
          {showAccountModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-centeks-navy border border-centeks-border rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
                <div className="bg-centeks-surface border-b border-centeks-border px-6 py-4 flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white">Yönetici Hesap & 2FA Güvenlik Ayarları</h3>
                  <button onClick={() => setShowAccountModal(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <div className="p-6 space-y-4">
                  <div className="space-y-2">
                    <h4 className="text-xs font-bold text-centeks-gold uppercase">Şifre Değiştir</h4>
                    <input type="password" placeholder="Mevcut Şifre" className="w-full bg-centeks-surface border border-centeks-border rounded-xl px-3 py-2 text-xs text-white" />
                    <input type="password" placeholder="Yeni Şifre" className="w-full bg-centeks-surface border border-centeks-border rounded-xl px-3 py-2 text-xs text-white" />
                  </div>
                  <div className="border-t border-centeks-border pt-3">
                    <h4 className="text-xs font-bold text-white mb-1">İki Aşamalı Doğrulama (2FA)</h4>
                    <p className="text-[11px] text-slate-400">Google Authenticator ile güvenli giriş koruması aktif.</p>
                  </div>
                </div>
                <div className="bg-centeks-surface px-6 py-3 border-t border-centeks-border flex justify-between">
                  <button onClick={() => alert('Şifre güncellendi.')} className="px-4 py-1.5 rounded-xl bg-centeks-gold text-centeks-dark text-xs font-bold">Kaydet</button>
                  <button onClick={() => setShowAccountModal(false)} className="px-4 py-1.5 rounded-xl bg-centeks-border text-white text-xs">Kapat</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 5: AUDIT LOGS */}
          {showAuditLogs && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-centeks-navy border border-centeks-border rounded-2xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col h-[460px]">
                <div className="bg-centeks-surface border-b border-centeks-border px-6 py-4 flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white">Güvenlik & Bağlantı Olay Günlüğü (Audit Trail)</h3>
                  <button onClick={() => setShowAuditLogs(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <div className="flex-1 p-8 text-center my-auto">
                  <div className="text-3xl mb-2">📜</div>
                  <h4 className="text-sm font-bold text-white">Kayıtlı Olay Bulunmuyor</h4>
                  <p className="text-xs text-slate-400 mt-1">Sistem üzerinden yeni bir uzak bağlantı başlatıldığında denetim izleri burada listelenecektir.</p>
                </div>
                <div className="bg-centeks-surface px-6 py-3 border-t border-centeks-border flex justify-end">
                  <button onClick={() => setShowAuditLogs(false)} className="px-4 py-1.5 rounded-xl bg-centeks-border text-white text-xs">Kapat</button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-centeks-navy/90 border-t border-centeks-border px-6 py-2.5 flex items-center justify-between text-xs text-slate-400">
            <div className="flex items-center gap-2">
              <span className="font-semibold text-slate-200">CENTEKS Destek v1.5.3</span>
              <span>•</span>
              <span>CENTEKS Group Bilgi İşlem Operasyon Merkezi</span>
            </div>
            <div className="flex items-center gap-4 text-[11px]">
              <span className="flex items-center gap-1.5 text-emerald-400">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                WebRTC & REST API Aktif
              </span>
              <span>SSL 256-bit TLS</span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
