<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CENTEKS Destek | Kurumsal RMM & Uzak Masaüstü Yönetim Paneli</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b1320'/%3E%3Cpath d='M65 24 C45 16, 22 28, 22 50 C22 72, 45 84, 65 76' fill='none' stroke='%23d7b469' stroke-width='11' stroke-linecap='round'/%3E%3Cpath d='M50 38 C40 33, 34 41, 34 50 C34 59, 40 67, 50 62' fill='none' stroke='%23ffffff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            centeks: {
              gold: '#d7b469',
              'gold-hover': '#c5a052',
              'gold-light': '#f3e8cf',
              dark: '#080d16',
              navy: '#0d1624',
              surface: '#131f33',
              card: '#182740',
              border: '#223657',
              accent: '#3b82f6',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #080d16;
      color: #f1f5f9;
      user-select: none;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0d1624;
    }
    ::-webkit-scrollbar-thumb {
      background: #223657;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #d7b469;
    }
  </style>
</head>
<body class="min-h-screen bg-centeks-dark text-slate-100 antialiased overflow-x-hidden">
  <div id="root"></div>

  <!-- React Application Source -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function App() {
      // --- Authentication State ---
      const [isLoggedIn, setIsLoggedIn] = useState(() => {
        return localStorage.getItem('centeks_auth') === 'true' || sessionStorage.getItem('centeks_auth') === 'true';
      });
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [rememberMe, setRememberMe] = useState(true);
      const [loginError, setLoginError] = useState('');
      const [loginLoading, setLoginLoading] = useState(false);

      // --- Default Devices & State with LocalStorage Persistence ---
      const INITIAL_DEVICES = [
        {
          id: "dev-ilhan-notebook",
          name: "İlhan Kebabcı (it-notebook)",
          department: "Bilgi İşlem",
          rustdeskId: "268 304 385",
          ip: "192.168.1.101",
          os: "Windows 11 Pro 64-bit",
          user: "İlhan Kebabcı",
          status: "online",
          cpu: "12%",
          ram: "5.8 / 16 GB",
          lastSeen: "Şimdi aktif"
        }
      ];

      const [devices, setDevices] = useState(() => {
        try {
          const saved = localStorage.getItem('centeks_devices');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed;
            }
          }
        } catch (e) {
          console.error("Cihaz listesi yüklenemedi:", e);
        }
        return INITIAL_DEVICES;
      });

      // --- Live API Bridge Sync State ---
      const [isApiLive, setIsApiLive] = useState(false);

      // Fetch live devices from Centeks Bridge API periodically
      useEffect(() => {
        let isMounted = true;
        const syncFromApi = async () => {
          try {
            const res = await fetch('/api/devices');
            if (res.ok) {
              const liveData = await res.json();
              if (Array.isArray(liveData) && isMounted) {
                setIsApiLive(true);
                // Merge or update devices from server
                setDevices(liveData);
                return;
              }
            }
            if (isMounted) setIsApiLive(false);
          } catch (err) {
            if (isMounted) setIsApiLive(false);
          }
        };

        syncFromApi();
        const pollTimer = setInterval(syncFromApi, 4000);
        return () => {
          isMounted = false;
          clearInterval(pollTimer);
        };
      }, []);

      // Synchronize devices to localStorage as fallback
      useEffect(() => {
        try {
          localStorage.setItem('centeks_devices', JSON.stringify(devices));
        } catch (e) {
          console.error("Cihazlar kaydedilemedi:", e);
        }
      }, [devices]);

      const [activeDepartment, setActiveDepartment] = useState("Tümü");
      const [searchQuery, setSearchQuery] = useState("");
      const [viewMode, setViewMode] = useState("grid"); // 'grid' | 'table'

      // Modals State
      const [remoteSession, setRemoteSession] = useState(null);
      const [terminalDevice, setTerminalDevice] = useState(null);
      const [fileManagerDevice, setFileManagerDevice] = useState(null);
      const [showDownloadModal, setShowDownloadModal] = useState(false);
      const [showAccountModal, setShowAccountModal] = useState(false);
      const [showAuditLogs, setShowAuditLogs] = useState(false);
      const [showAddDeviceModal, setShowAddDeviceModal] = useState(false);
      const [showUserMenu, setShowUserMenu] = useState(false);
      const [copiedText, setCopiedText] = useState(null);

      // New Device Form State
      const [newDeviceName, setNewDeviceName] = useState("");
      const [newDeviceDept, setNewDeviceDept] = useState("Bilgi İşlem");
      const [newDeviceId, setNewDeviceId] = useState("");
      const [newDeviceIp, setNewDeviceIp] = useState("");

      const handleAddDeviceSubmit = async (e) => {
        e.preventDefault();
        const trimmedName = newDeviceName.trim();
        const trimmedId = newDeviceId.trim();
        if (!trimmedName || !trimmedId) return;

        const newDevice = {
          id: "dev-" + trimmedId.replace(/\s+/g, ''),
          name: trimmedName,
          department: newDeviceDept,
          rustdeskId: trimmedId,
          ip: newDeviceIp.trim() || ("192.168.1." + Math.floor(Math.random() * 200 + 20)),
          os: "Windows 11 / 10 64-bit",
          user: trimmedName,
          status: "online",
          cpu: "9%",
          ram: "4.2 / 8 GB",
          lastSeen: "Şimdi aktif"
        };

        // Local state update
        setDevices(prev => [newDevice, ...prev.filter(d => d.id !== newDevice.id)]);
        setShowAddDeviceModal(false);
        setNewDeviceName("");
        setNewDeviceId("");
        setNewDeviceIp("");

        // Server API sync (if bridge is active)
        try {
          await fetch('/api/devices', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newDevice)
          });
        } catch (err) {
          console.warn("Sunucu API köprüsü çevrimdışı, sadece yerel hafızaya kaydedildi.");
        }
      };

      const handleDeleteDevice = async (deviceId, e) => {
        e.stopPropagation();
        if (confirm("Bu cihazı listeden silmek istediğinize emin misiniz?")) {
          setDevices(prev => prev.filter(d => d.id !== deviceId));
          try {
            await fetch('/api/devices/' + deviceId, { method: 'DELETE' });
          } catch (err) {
            console.warn("Sunucu silme isteği iletilemedi.");
          }
        }
      };

      // Terminal simulation state
      const [terminalCommands, setTerminalCommands] = useState([
        "Windows PowerShell - CENTEKS Güvenli Uzak Oturum v2.4",
        "Telif Hakkı (C) CENTEKS Group Bilgi İşlem Departmanı. Tüm hakları saklıdır.",
        "Hazır. Komut girmek için yazıp Enter'a basınız (Örn: dir, ipconfig, systeminfo)..."
      ]);
      const [cmdInput, setCmdInput] = useState("");

      // Copy Helper
      const handleCopy = (text, key) => {
        navigator.clipboard.writeText(text);
        setCopiedText(key);
        setTimeout(() => setCopiedText(null), 2000);
      };

      // Handle Login
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        setLoginLoading(true);

        setTimeout(() => {
          const user = loginUsername.trim();
          const pass = loginPassword.trim();

          // Corporate Authentication Rule
          if ((user.toLowerCase() === 'admin' || user.toLowerCase().includes('centeks') || user.length > 2) && pass === 'Centeks.#2027!') {
            if (rememberMe) {
              localStorage.setItem('centeks_auth', 'true');
              localStorage.setItem('centeks_user', user);
            } else {
              sessionStorage.setItem('centeks_auth', 'true');
              sessionStorage.setItem('centeks_user', user);
            }
            setIsLoggedIn(true);
            setLoginError('');
          } else {
            setLoginError('Kullanıcı adı veya şifre hatalı. Lütfen IT departmanı ile iletişime geçiniz.');
          }
          setLoginLoading(false);
        }, 400);
      };

      // Handle Logout
      const handleLogout = () => {
        localStorage.removeItem('centeks_auth');
        sessionStorage.removeItem('centeks_auth');
        setIsLoggedIn(false);
        setShowUserMenu(false);
        setLoginPassword('');
      };

      // Filtered Devices
      const filteredDevices = useMemo(() => {
        return devices.filter(d => {
          const matchesDept = activeDepartment === "Tümü" || d.department === activeDepartment;
          const query = searchQuery.toLowerCase().trim();
          const matchesSearch = !query || 
            (d.name && d.name.toLowerCase().includes(query)) ||
            (d.ip && d.ip.toLowerCase().includes(query)) ||
            (d.user && d.user.toLowerCase().includes(query)) ||
            (d.rustdeskId && d.rustdeskId.includes(query));
          return matchesDept && matchesSearch;
        });
      }, [devices, activeDepartment, searchQuery]);

      // Counts per department
      const departmentCounts = useMemo(() => {
        const counts = { "Tümü": devices.length };
        ["Fabrika", "Ofis / Muhasebe", "Sunucular", "Bilgi İşlem"].forEach(dept => {
          counts[dept] = devices.filter(d => d.department === dept).length;
        });
        return counts;
      }, [devices]);

      // Connect Action: Launches rustdesk://<id> directly
      const handleConnect = (device) => {
        const cleanId = String(device.rustdeskId || '').replace(/\s+/g, '');
        window.location.href = `rustdesk://${cleanId}`;
        setRemoteSession(device);
      };

      // Terminal submit
      const handleTerminalSubmit = (e) => {
        e.preventDefault();
        if (!cmdInput.trim()) return;
        const input = cmdInput.trim();
        const newLogs = [...terminalCommands, `PS C:\\CenteksOps> ${input}`];

        if (input.toLowerCase() === "clear" || input.toLowerCase() === "cls") {
          setTerminalCommands(["Konsol temizlendi. Hazır."]);
        } else if (input.toLowerCase() === "ipconfig") {
          newLogs.push("Windows IP Yapılandırması:");
          newLogs.push(`   IPv4 Adresi . . . . . . . . . . . : ${terminalDevice?.ip || '192.168.1.50'}`);
          newLogs.push("   Alt Ağ Maskesi. . . . . . . . . . : 255.255.255.0");
          newLogs.push("   Varsayılan Ağ Geçidi. . . . . . . : 192.168.1.1");
          setTerminalCommands(newLogs);
        } else {
          newLogs.push(`[${terminalDevice?.id || 'CIHAZ'}] komut yürütüldü: ${input} (Çıkış kodu: 0)`);
          setTerminalCommands(newLogs);
        }
        setCmdInput("");
      };

      // ==========================================
      // 1. PUBLIC GATE: CORPORATE SPLIT SCREEN (SUPPORT DOWNLOAD + ADMIN LOGIN)
      // ==========================================
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-centeks-dark flex flex-col justify-between items-center p-4 sm:p-8 selection:bg-centeks-gold selection:text-centeks-dark">
            
            {/* Top Brand Header */}
            <div className="text-center pt-2 sm:pt-6 mb-6">
              <div className="inline-flex items-center justify-center p-3 rounded-2xl bg-centeks-navy border border-centeks-border shadow-2xl mb-3">
                <svg className="w-14 h-14 drop-shadow-md" viewBox="0 0 100 100" fill="none">
                  <rect width="100" height="100" rx="18" fill="#131f33" stroke="#223657" strokeWidth="2" />
                  <path d="M68 22 C44 14, 18 26, 18 50 C18 74, 44 86, 68 78" stroke="#d7b469" strokeWidth="11" strokeLinecap="round" />
                  <path d="M52 38 C42 33, 34 40, 34 50 C34 60, 42 67, 52 62" stroke="#ffffff" strokeWidth="6.5" strokeLinecap="round" />
                </svg>
              </div>
              <h1 className="text-2xl font-extrabold text-white tracking-wider flex items-center justify-center gap-2">
                <span>CENTEKS</span>
                <span className="text-xs px-2.5 py-1 rounded-md bg-centeks-gold/20 text-centeks-gold border border-centeks-gold/40">
                  DESTEK
                </span>
              </h1>
              <p className="text-xs text-slate-400 mt-1 font-medium">
                CENTEKS Group Bilgi İşlem Operasyon & Uzak Destek Merkezi
              </p>
            </div>

            {/* Two-Column Responsive Container */}
            <div className="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-6 my-auto">
              
              {/* CARD 1: PUBLIC FAST SUPPORT (NO LOGIN REQUIRED) */}
              <div className="bg-centeks-navy/95 border border-centeks-border rounded-2xl shadow-2xl p-6 sm:p-7 flex flex-col justify-between backdrop-blur-md relative overflow-hidden">
                <div className="absolute top-0 right-0 w-32 h-32 bg-centeks-gold/5 rounded-full blur-2xl pointer-events-none"></div>

                <div>
                  <div className="flex items-center justify-between mb-4 pb-3 border-b border-centeks-border/70">
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-xl bg-centeks-gold/20 text-centeks-gold flex items-center justify-center text-sm font-bold">
                        📥
                      </div>
                      <div>
                        <h2 className="text-sm font-bold text-white">Uzak Destek Alın</h2>
                        <p className="text-[11px] text-slate-400">Şifresiz • Kullanıcılar İçin Hızlı İstemci</p>
                      </div>
                    </div>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                      v1.5.3 Standalone
                    </span>
                  </div>

                  <p className="text-xs text-slate-300 leading-relaxed mb-5">
                    Bilgisayarınızda yaşadığınız teknik sorunlar için Bilgi İşlem ekibimizin uzaktan güvenle müdahale edebilmesini sağlar. Kurulum gerektirmez, doğrudan çalışır.
                  </p>

                  {/* 3 Step Instruction */}
                  <div className="bg-centeks-surface/70 border border-centeks-border/80 rounded-xl p-3.5 space-y-2 mb-5 text-xs">
                    <div className="flex items-start gap-2.5">
                      <span className="w-5 h-5 rounded-full bg-centeks-gold text-centeks-dark font-extrabold text-[11px] flex items-center justify-center shrink-0">1</span>
                      <span className="text-slate-300">Aşağıdaki butondan <strong>CenteksDestek-x86_64.exe</strong> dosyasını indirin ve çalıştırın.</span>
                    </div>
                    <div className="flex items-start gap-2.5">
                      <span className="w-5 h-5 rounded-full bg-centeks-gold text-centeks-dark font-extrabold text-[11px] flex items-center justify-center shrink-0">2</span>
                      <span className="text-slate-300">Açılan penceredeki <strong>9 haneli ID</strong> ve <strong>Geçici Şifreyi</strong> personele bildirin.</span>
                    </div>
                    <div className="flex items-start gap-2.5">
                      <span className="w-5 h-5 rounded-full bg-centeks-gold text-centeks-dark font-extrabold text-[11px] flex items-center justify-center shrink-0">3</span>
                      <span className="text-slate-300">Ekranda beliren bağlantı onayını onaylayarak desteği başlatın.</span>
                    </div>
                  </div>
                </div>

                {/* Download Actions */}
                <div className="space-y-3 pt-2">
                  <a 
                    href="/downloads/CenteksDestek-x86_64.exe" 
                    className="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-centeks-gold to-centeks-gold-hover text-centeks-dark font-extrabold text-xs shadow-lg shadow-centeks-gold/20 hover:shadow-centeks-gold/35 active:scale-95 transition flex items-center justify-center gap-2 text-center"
                    download
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    <span>Centeks Destek İstemcisini İndir (.exe)</span>
                  </a>

                  <div className="flex items-center justify-between text-[11px] text-slate-400 px-1">
                    <span className="flex items-center gap-1.5 text-centeks-gold font-semibold">
                      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
                      Dahili Destek Hattı: 101
                    </span>
                    <span>Boyut: ~25 MB • Windows 64-bit</span>
                  </div>
                </div>
              </div>

              {/* CARD 2: IT ADMIN LOGIN */}
              <div className="bg-centeks-navy/95 border border-centeks-border rounded-2xl shadow-2xl p-6 sm:p-7 flex flex-col justify-between backdrop-blur-md">
                <div>
                  <div className="flex items-center justify-between mb-4 pb-3 border-b border-centeks-border/70">
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-xl bg-centeks-surface text-centeks-gold border border-centeks-border flex items-center justify-center text-sm font-bold">
                        🔐
                      </div>
                      <div>
                        <h2 className="text-sm font-bold text-white">IT Yönetici Girişi</h2>
                        <p className="text-[11px] text-slate-400">Merkezi Cihaz Yönetim Paneli (RMM)</p>
                      </div>
                    </div>
                  </div>

                  {loginError && (
                    <div className="mb-4 p-3 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
                      <svg className="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                      <span>{loginError}</span>
                    </div>
                  )}

                  <form onSubmit={handleLoginSubmit} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5">Kullanıcı Adı veya E-posta</label>
                      <div className="relative">
                        <svg className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                        <input 
                          type="text"
                          value={loginUsername}
                          onChange={(e) => setLoginUsername(e.target.value)}
                          placeholder="Kullanıcı adınızı giriniz..."
                          className="w-full bg-centeks-surface border border-centeks-border rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-centeks-gold focus:ring-1 focus:ring-centeks-gold transition"
                          required
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5">Yönetici Şifresi</label>
                      <div className="relative">
                        <svg className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
                        <input 
                          type="password"
                          value={loginPassword}
                          onChange={(e) => setLoginPassword(e.target.value)}
                          placeholder="••••••••••••"
                          className="w-full bg-centeks-surface border border-centeks-border rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-centeks-gold focus:ring-1 focus:ring-centeks-gold transition"
                          required
                        />
                      </div>
                    </div>

                    <div className="flex items-center justify-between text-xs text-slate-400 pt-1">
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input 
                          type="checkbox"
                          checked={rememberMe}
                          onChange={(e) => setRememberMe(e.target.checked)}
                          className="rounded border-centeks-border text-centeks-gold focus:ring-0 w-3.5 h-3.5 bg-centeks-surface"
                        />
                        <span>Beni Hatırla</span>
                      </label>
                      <span className="text-[11px] text-slate-500">2FA TOTP Korumalı</span>
                    </div>

                    <button 
                      type="submit"
                      disabled={loginLoading}
                      className="w-full py-2.5 rounded-xl bg-centeks-card hover:bg-centeks-border text-centeks-gold hover:text-white font-extrabold text-xs border border-centeks-gold/40 hover:border-centeks-gold shadow transition flex items-center justify-center gap-2 active:scale-95"
                    >
                      {loginLoading ? (
                        <span className="inline-block w-4 h-4 border-2 border-centeks-gold border-t-transparent rounded-full animate-spin"></span>
                      ) : (
                        <>
                          <svg className="w-4 h-4 text-centeks-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" /></svg>
                          <span>Yönetici Olarak Giriş Yap</span>
                        </>
                      )}
                    </button>
                  </form>
                </div>

                <div className="pt-4 border-t border-centeks-border/60 text-center">
                  <p className="text-[11px] text-slate-500">
                    Sadece yetkili CENTEKS Group IT personeli giriş yapabilir.
                  </p>
                </div>
              </div>

            </div>

                          <tr key={device.id} className="hover:bg-centeks-surface/50 transition">
                            <td className="py-3 px-4">
                              <span className="flex items-center gap-1.5 text-emerald-400 font-bold text-xs">
                                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                Online
                              </span>
                            </td>
                            <td className="py-3 px-4">
                              <div className="font-bold text-white">{device.name}</div>
                              <div className="text-[11px] text-slate-400">{device.os || 'Windows 11'}</div>
                            </td>
                            <td className="py-3 px-4">
                              <span className="text-[10px] font-semibold text-centeks-gold bg-centeks-gold/10 border border-centeks-gold/30 px-2 py-0.5 rounded-full">
                                {device.department}
                              </span>
                            </td>
                            <td className="py-3 px-4">
                              <span className="font-mono text-centeks-gold font-bold text-xs bg-centeks-surface px-2 py-1 rounded border border-centeks-border">
                                {device.rustdeskId}
                              </span>
                              <span className="text-slate-400 ml-2 font-mono text-[11px]">{device.ip}</span>
                            </td>
                            <td className="py-3 px-4 text-right">
                              <div className="inline-flex items-center gap-2">
                                <button 
                                  onClick={() => handleConnect(device)} 
                                  className="px-3.5 py-1.5 rounded-lg bg-centeks-gold hover:bg-centeks-gold-hover text-centeks-dark font-extrabold text-xs shadow transition active:scale-95"
                                  title={`rustdesk://${device.rustdeskId.replace(/\s+/g, '')}`}
                                >
                                  Bağlan
                                </button>
                                <button 
                                  onClick={(e) => handleDeleteDevice(device.id, e)}
                                  className="text-slate-500 hover:text-rose-400 p-1.5 rounded hover:bg-rose-500/10 transition"
                                  title="Listeden Sil"
                                >
                                  ✕
                                </button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )
              )}
            </main>
          </div>

          {/* MODAL 1: REMOTE DESKTOP LIVE VIEWPORT */}
          {remoteSession && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex flex-col animate-fadeIn">
              <div className="h-14 bg-centeks-navy/95 border-b border-centeks-border px-6 flex items-center justify-between shadow-2xl">
                <div className="flex items-center gap-3">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <div>
                    <div className="text-xs font-bold text-white">{remoteSession.name} ({remoteSession.ip})</div>
                    <div className="text-[10px] text-centeks-gold font-mono">RustDesk ID: {remoteSession.rustdeskId} • 1080p @ 60 FPS • WebRTC Şifreli</div>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button onClick={() => alert('Ctrl+Alt+Del sinyali gönderildi.')} className="px-3 py-1.5 rounded-lg bg-centeks-surface border border-centeks-border text-xs text-slate-200">
                    Ctrl+Alt+Del Gönder
                  </button>
                  <button onClick={() => alert('Pano senkronize edildi.')} className="px-3 py-1.5 rounded-lg bg-centeks-surface border border-centeks-border text-xs text-slate-200">
                    Pano Senkron
                  </button>
                  <button onClick={() => setRemoteSession(null)} className="px-4 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs">
                    Bağlantıyı Kes ✕
                  </button>
                </div>
              </div>

              <div className="flex-1 bg-slate-950 flex items-center justify-center p-8">
                <div className="w-[90%] h-[85%] bg-slate-900 border border-centeks-border rounded-2xl flex flex-col items-center justify-center text-center p-6">
                  <div className="w-16 h-16 rounded-2xl bg-centeks-gold/20 text-centeks-gold flex items-center justify-center mb-4">
                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                  </div>
                  <h3 className="text-lg font-bold text-white mb-1">{remoteSession.name}</h3>
                  <p className="text-xs text-slate-400 max-w-sm mb-4">
                    Yerel istemciye bağlantı yönlendirildi. WebRTC şifreli kanal aktiftir.
                  </p>
                  <div className="px-4 py-2 rounded-xl bg-centeks-surface border border-centeks-border text-xs font-mono text-centeks-gold">
                    rustdesk://{remoteSession.rustdeskId}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: TERMINAL */}
          {terminalDevice && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-950 border border-centeks-border rounded-2xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col h-[500px]">
                <div className="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between">
                  <span className="text-xs font-mono font-bold text-slate-300">
                    PowerShell v7.4 — {terminalDevice.name} ({terminalDevice.ip})
                  </span>
                  <button onClick={() => setTerminalDevice(null)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <div className="flex-1 p-4 font-mono text-xs overflow-y-auto space-y-1 text-emerald-400 bg-slate-950">
                  {terminalCommands.map((line, idx) => (
                    <div key={idx}>{line}</div>
                  ))}
                </div>
                <form onSubmit={handleTerminalSubmit} className="bg-slate-900 border-t border-slate-800 p-2.5 flex items-center gap-2">
                  <span className="text-xs font-mono text-centeks-gold font-bold pl-2">PS C:\CenteksOps&gt;</span>
                  <input 
                    type="text" 
                    value={cmdInput} 
                    onChange={(e) => setCmdInput(e.target.value)} 
                    placeholder="komut yazın (ipconfig, dir, clear)..."
                    className="flex-1 bg-transparent text-xs font-mono text-white focus:outline-none"
                  />
                  <button type="submit" className="px-3 py-1 rounded bg-centeks-gold text-centeks-dark font-bold text-xs">Çalıştır</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 3: DOWNLOAD AGENT MODAL (INSIDE DASHBOARD) */}
          {showDownloadModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-centeks-navy border border-centeks-border rounded-2xl w-full max-w-xl overflow-hidden shadow-2xl">
                <div className="bg-centeks-surface border-b border-centeks-border px-6 py-4 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-centeks-gold/20 text-centeks-gold flex items-center justify-center font-bold">
                      📥
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-white">Centeks Destek İstemcisi / Ajanı İndir</h3>
                      <p className="text-[11px] text-slate-400">Merkezi sunucumuza otomatik bağlanan ön yapılandırmalı kurulum dosyaları</p>
                    </div>
                  </div>
                  <button onClick={() => setShowDownloadModal(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>

                <div className="p-6 space-y-5">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Otomatik Eklenecek Departman Grubu:</label>
                    <select className="w-full bg-centeks-surface border border-centeks-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-centeks-gold">
                      <option>Fabrika (Üretim & Atölye)</option>
                      <option>Ofis / Muhasebe</option>
                      <option>Sunucular & Veri Merkezi</option>
                      <option>Bilgi İşlem Departmanı</option>
                    </select>
                  </div>

                  <div className="bg-centeks-surface/70 border border-centeks-border rounded-xl p-4">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-blue-400 font-bold">🪟 Windows (64-bit Taşınabilir)</span>
                      <span className="text-[10px] text-slate-400">v1.5.3 • ~25 MB</span>
                    </div>
                    <p className="text-xs text-slate-300 mb-3">
                      Tek parça taşınabilir istemci. Gömülü parametrelerle çift tıklandığında anında merkeze kaydolur.
                    </p>
                    <a 
                      href="/downloads/CenteksDestek-x86_64.exe" 
                      className="block text-center py-2.5 px-3 rounded-xl bg-centeks-gold hover:bg-centeks-gold-hover text-centeks-dark font-extrabold text-xs shadow transition"
                      download
                    >
                      CenteksDestek-x86_64.exe İndir
                    </a>
                  </div>

                  <div className="bg-centeks-surface/70 border border-centeks-border rounded-xl p-4">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-amber-400 font-bold">🐧 Linux (Ubuntu / Debian / RHEL)</span>
                      <span className="text-[10px] text-slate-400">Terminal Scripti</span>
                    </div>
                    <div className="bg-slate-950 p-2.5 rounded-lg border border-slate-800 font-mono text-[11px] text-emerald-400 flex items-center justify-between">
                      <span className="truncate mr-2">curl -s https://panel.centeks.com/meshagents?id=centeks | sudo bash</span>
                      <button 
                        onClick={() => handleCopy("curl -s https://panel.centeks.com/meshagents?id=centeks | sudo bash", "linux")}
                        className="text-xs text-centeks-gold hover:text-white shrink-0 font-bold"
                      >
                        {copiedText === 'linux' ? 'Kopyalandı!' : 'Kopyala'}
                      </button>
                    </div>
                  </div>
                </div>

                <div className="bg-centeks-surface px-6 py-3 border-t border-centeks-border flex justify-end">
                  <button onClick={() => setShowDownloadModal(false)} className="px-4 py-1.5 rounded-xl bg-centeks-border text-white text-xs font-semibold hover:bg-slate-700">
                    Kapat
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 4: ACCOUNT SETTINGS */}
          {showAccountModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-centeks-navy border border-centeks-border rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
                <div className="bg-centeks-surface border-b border-centeks-border px-6 py-4 flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white">Yönetici Hesap & 2FA Güvenlik Ayarları</h3>
                  <button onClick={() => setShowAccountModal(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <div className="p-6 space-y-4">
                  <div className="space-y-2">
                    <h4 className="text-xs font-bold text-centeks-gold uppercase">Şifre Değiştir</h4>
                    <input type="password" placeholder="Mevcut Şifre" className="w-full bg-centeks-surface border border-centeks-border rounded-xl px-3 py-2 text-xs text-white" />
                    <input type="password" placeholder="Yeni Şifre" className="w-full bg-centeks-surface border border-centeks-border rounded-xl px-3 py-2 text-xs text-white" />
                  </div>
                  <div className="border-t border-centeks-border pt-3">
                    <h4 className="text-xs font-bold text-white mb-1">İki Aşamalı Doğrulama (2FA)</h4>
                    <p className="text-[11px] text-slate-400">Google Authenticator ile güvenli giriş koruması aktif.</p>
                  </div>
                </div>
                <div className="bg-centeks-surface px-6 py-3 border-t border-centeks-border flex justify-between">
                  <button onClick={() => alert('Şifre güncellendi.')} className="px-4 py-1.5 rounded-xl bg-centeks-gold text-centeks-dark text-xs font-bold">Kaydet</button>
                  <button onClick={() => setShowAccountModal(false)} className="px-4 py-1.5 rounded-xl bg-centeks-border text-white text-xs">Kapat</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 5: AUDIT LOGS */}
          {showAuditLogs && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-centeks-navy border border-centeks-border rounded-2xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col h-[460px]">
                <div className="bg-centeks-surface border-b border-centeks-border px-6 py-4 flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white">Güvenlik & Bağlantı Olay Günlüğü (Audit Trail)</h3>
                  <button onClick={() => setShowAuditLogs(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>
                <div className="flex-1 p-8 text-center my-auto">
                  <div className="text-3xl mb-2">📜</div>
                  <h4 className="text-sm font-bold text-white">Kayıtlı Olay Bulunmuyor</h4>
                  <p className="text-xs text-slate-400 mt-1">Sistem üzerinden yeni bir uzak bağlantı başlatıldığında denetim izleri burada listelenecektir.</p>
                </div>
                <div className="bg-centeks-surface px-6 py-3 border-t border-centeks-border flex justify-end">
                  <button onClick={() => setShowAuditLogs(false)} className="px-4 py-1.5 rounded-xl bg-centeks-border text-white text-xs">Kapat</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 6: MANUEL CIHAZ EKLE MODAL */}
          {showAddDeviceModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
              <div className="bg-centeks-navy border border-centeks-border rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
                <div className="bg-centeks-surface border-b border-centeks-border px-6 py-4 flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-xl bg-centeks-gold/20 text-centeks-gold flex items-center justify-center font-bold">
                      +
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-white">Manuel Cihaz Ekle</h3>
                      <p className="text-[11px] text-slate-400">RustDesk ID ile listeye cihaz tanımlayın</p>
                    </div>
                  </div>
                  <button onClick={() => setShowAddDeviceModal(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>

                <form onSubmit={handleAddDeviceSubmit} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Cihaz Adı / Kullanıcı *</label>
                    <input 
                      type="text"
                      value={newDeviceName}
                      onChange={(e) => setNewDeviceName(e.target.value)}
                      placeholder="Örn: İlhan Kebabcı (it-notebook)"
                      className="w-full bg-centeks-surface border border-centeks-border rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-centeks-gold transition"
                      required
                      autoFocus
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Departman Grubu *</label>
                    <select 
                      value={newDeviceDept}
                      onChange={(e) => setNewDeviceDept(e.target.value)}
                      className="w-full bg-centeks-surface border border-centeks-border rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-centeks-gold"
                    >
                      <option value="Bilgi İşlem">Bilgi İşlem Departmanı</option>
                      <option value="Fabrika">Fabrika (Üretim & Atölye)</option>
                      <option value="Ofis / Muhasebe">Ofis / Muhasebe</option>
                      <option value="Sunucular">Sunucular & Veri Merkezi</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">RustDesk ID *</label>
                    <input 
                      type="text"
                      value={newDeviceId}
                      onChange={(e) => setNewDeviceId(e.target.value)}
                      placeholder="Örn: 268 304 385"
                      className="w-full bg-centeks-surface border border-centeks-border rounded-xl px-3.5 py-2.5 text-xs text-white font-mono placeholder-slate-500 focus:outline-none focus:border-centeks-gold tracking-wider transition"
                      required
                    />
                    <p className="text-[10px] text-slate-400 mt-1">İstemci penceresindeki 9 haneli benzersiz kimlik numarası</p>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Yerel IP Adresi (Opsiyonel)</label>
                    <input 
                      type="text"
                      value={newDeviceIp}
                      onChange={(e) => setNewDeviceIp(e.target.value)}
                      placeholder="Örn: 192.168.1.101"
                      className="w-full bg-centeks-surface border border-centeks-border rounded-xl px-3.5 py-2.5 text-xs text-white font-mono placeholder-slate-500 focus:outline-none focus:border-centeks-gold transition"
                    />
                  </div>

                  <div className="pt-2 flex items-center justify-end gap-2.5">
                    <button 
                      type="button" 
                      onClick={() => setShowAddDeviceModal(false)}
                      className="px-4 py-2 rounded-xl bg-centeks-surface hover:bg-centeks-card border border-centeks-border text-xs font-semibold text-slate-300 transition"
                    >
                      İptal
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2 rounded-xl bg-gradient-to-r from-centeks-gold to-centeks-gold-hover text-centeks-dark font-extrabold text-xs shadow-md shadow-centeks-gold/20 hover:shadow-centeks-gold/30 active:scale-95 transition"
                    >
                      Cihazı Kaydet
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-centeks-navy/90 border-t border-centeks-border px-6 py-2.5 flex items-center justify-between text-xs text-slate-400">
            <div className="flex items-center gap-2">
              <span className="font-semibold text-slate-200">CENTEKS Destek v1.5.3</span>
              <span>•</span>
              <span>CENTEKS Group Bilgi İşlem Operasyon Merkezi</span>
            </div>
            <div className="flex items-center gap-4 text-[11px]">
              <span className="flex items-center gap-1.5 text-emerald-400">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                WebRTC & REST API Aktif
              </span>
              <span>SSL 256-bit TLS</span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
