                      Tek parça taşınabilir istemci. Gömülü parametrelerle çift tıklandığında anında panele kayıt olur ve destek almaya hazır hale gelir.
                    </p>
                    <div className="flex gap-2">
                      <a 
                        href="https://github.com/ilhankebabci/rustdesk/actions" 
                        target="_blank"
                        className="flex-1 text-center py-2 px-3 rounded-xl bg-centeks-gold hover:bg-centeks-gold-hover text-centeks-dark font-bold text-xs shadow transition"
                      >
                        CenteksDestek-x86_64.exe İndir
                      </a>
                    </div>
                  </div>

                  {/* Linux Card */}
                  <div className="bg-centeks-surface/70 border border-centeks-border rounded-xl p-4">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-amber-400 font-bold">🐧 Linux (Ubuntu / Debian / RHEL)</span>
                      <span className="text-[10px] text-slate-400">Tek Tık Terminal Scripti</span>
                    </div>
                    <div className="bg-slate-950 p-2.5 rounded-lg border border-slate-800 font-mono text-[11px] text-emerald-400 flex items-center justify-between">
                      <span className="truncate mr-2">curl -s https://panel.centeks.com/meshagents?id=centeks | sudo bash</span>
                      <button 
                        onClick={() => handleCopy("curl -s https://panel.centeks.com/meshagents?id=centeks | sudo bash", "linux")}
                        className="text-xs text-centeks-gold hover:text-white shrink-0 font-bold"
                      >
                        {copiedText === 'linux' ? 'Kopyalandı!' : 'Kopyala'}
                      </button>
                    </div>
                  </div>
                </div>

                <div className="bg-centeks-surface px-6 py-3 border-t border-centeks-border flex justify-end">
                  <button onClick={() => setShowDownloadModal(false)} className="px-4 py-1.5 rounded-xl bg-centeks-border text-white text-xs font-semibold hover:bg-slate-700">
                    Kapat
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 5: ACCOUNT SETTINGS & 2FA */}
          {showAccountModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-centeks-navy border border-centeks-border rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
                <div className="bg-centeks-surface border-b border-centeks-border px-6 py-4 flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <svg className="w-4 h-4 text-centeks-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                    Yönetici Hesap & Güvenlik Ayarları
                  </h3>
                  <button onClick={() => setShowAccountModal(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                </div>

                <div className="p-6 space-y-5">
                  {/* Password Change */}
                  <div className="space-y-3">
                    <h4 className="text-xs font-bold text-centeks-gold uppercase tracking-wider">Şifre Değiştir</h4>
                    <input type="password" placeholder="Mevcut Şifre" className="w-full bg-centeks-surface border border-centeks-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-centeks-gold" />
                    <input type="password" placeholder="Yeni Şifre" className="w-full bg-centeks-surface border border-centeks-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-centeks-gold" />
                    <input type="password" placeholder="Yeni Şifre (Tekrar)" className="w-full bg-centeks-surface border border-centeks-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-centeks-gold" />
                  </div>

                  {/* 2FA Section */}
                  <div className="border-t border-centeks-border pt-4 space-y-3">
                    <div className="flex items-center justify-between">
                      <div>
                        <h4 className="text-xs font-bold text-white">İki Aşamalı Doğrulama (2FA / TOTP)</h4>
                        <p className="text-[11px] text-slate-400">Google Authenticator ile girişte kod zorunluluğu</p>
                      </div>
                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                        Aktif
                      </span>
                    </div>

                    <div className="bg-centeks-surface p-3 rounded-xl border border-centeks-border flex items-center gap-4">
                      {/* Mock QR */}
                      <div className="w-16 h-16 bg-white p-1 rounded-lg shrink-0 flex items-center justify-center">
                        <div className="w-full h-full bg-slate-900 flex items-center justify-center text-[9px] text-centeks-gold font-bold text-center">
                          2FA QR
                        </div>
                      </div>
                      <div className="text-xs space-y-1">
                        <div className="text-slate-300 font-mono text-[11px]">Gizli Anahtar: <span className="text-centeks-gold font-bold">JBSW Y3DP EHPK 3PXP</span></div>
                        <div className="text-[11px] text-slate-400">Yedek Kodlar: 4 adet kullanılabilir kod mevcut.</div>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="bg-centeks-surface px-6 py-3 border-t border-centeks-border flex justify-between items-center">
                  <button onClick={() => alert('Şifre güncellendi.')} className="px-4 py-1.5 rounded-xl bg-centeks-gold hover:bg-centeks-gold-hover text-centeks-dark text-xs font-bold shadow">
                    Değişiklikleri Kaydet
                  </button>
                  <button onClick={() => setShowAccountModal(false)} className="px-4 py-1.5 rounded-xl bg-centeks-border text-white text-xs font-semibold hover:bg-slate-700">
                    Kapat
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 6: AUDIT LOGS */}
          {showAuditLogs && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-centeks-navy border border-centeks-border rounded-2xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col h-[520px]">
                <div className="bg-centeks-surface border-b border-centeks-border px-6 py-4 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-lg bg-centeks-gold/20 text-centeks-gold flex items-center justify-center">
                      📜
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-white">Güvenlik & Bağlantı Olay Günlüğü (Audit Trail)</h3>
                      <p className="text-[11px] text-slate-400">Hangi operatörün hangi makinaya ne zaman bağlandığının eksiksiz kaydı</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => alert('Olay günlüğü CSV formatında dışa aktarıldı.')}
                      className="px-3 py-1.5 rounded-lg bg-centeks-card hover:bg-centeks-border text-centeks-gold font-bold text-xs border border-centeks-border transition"
                    >
                      Dışa Aktar (CSV)
                    </button>
                    <button onClick={() => setShowAuditLogs(false)} className="text-slate-400 hover:text-white text-xs">✕</button>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-4">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-centeks-surface text-slate-400 uppercase font-semibold border-b border-centeks-border">
                      <tr>
                        <th className="py-2.5 px-3">Zaman</th>
                        <th className="py-2.5 px-3">Kullanıcı</th>
                        <th className="py-2.5 px-3">Hedef Cihaz</th>
                        <th className="py-2.5 px-3">Yapılan İşlem</th>
                        <th className="py-2.5 px-3">Süre</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-centeks-border/40">
                      {AUDIT_LOGS.map(log => (
                        <tr key={log.id} className="hover:bg-centeks-surface/40 transition">
                          <td className="py-2.5 px-3 font-mono text-slate-400">{log.time}</td>
                          <td className="py-2.5 px-3 font-semibold text-white">{log.user}</td>
                          <td className="py-2.5 px-3 font-mono text-centeks-gold">{log.device}</td>
                          <td className="py-2.5 px-3 text-slate-300">{log.action}</td>
                          <td className="py-2.5 px-3 font-mono text-emerald-400">{log.duration}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="bg-centeks-surface px-6 py-3 border-t border-centeks-border flex justify-end">
                  <button onClick={() => setShowAuditLogs(false)} className="px-4 py-1.5 rounded-xl bg-centeks-border text-white text-xs font-semibold hover:bg-slate-700">
                    Kapat
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-centeks-navy/90 border-t border-centeks-border px-6 py-2.5 flex items-center justify-between text-xs text-slate-400">
            <div className="flex items-center gap-2">
              <span className="font-semibold text-slate-200">CENTEKS Destek v1.5.3</span>
              <span>•</span>
              <span>CENTEKS Group Bilgi İşlem Operasyon Merkezi</span>
            </div>
            <div className="flex items-center gap-4 text-[11px]">
              <span className="flex items-center gap-1.5 text-emerald-400">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                WebRTC & REST API Aktif
              </span>
              <span>SSL 256-bit TLS</span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
